name: SOVR Galaxy A50 Package Matrix

on:
  workflow_dispatch:
    inputs:
      profile:
        description: ROM profile to build
        type: choice
        required: true
        default: all
        options:
          - all
          - oneui4
          - oneui5
          - oneui6
          - oneui7
          - oneui8
          - oneui85
          - aosp
      package_type:
        description: Root integration to build
        type: choice
        required: true
        default: all
        options:
          - all
          - simple
          - magisk
          - kernelsu
  pull_request:
    branches:
      - main
  push:
    branches:
      - crypto143007-ship-it-v4-1-development

permissions:
  contents: read

jobs:
  select_matrix:
    name: Select requested package matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          PROFILE_INPUT: ${{ inputs.profile }}
          PACKAGE_TYPE_INPUT: ${{ inputs.package_type }}
        run: |
          python3 - <<'PY'
          import json
          import os

          profiles = [
              {"profile_id": "oneui4", "profile_name": "OneUI4", "variant": "oneui", "android": 12, "experimental": False},
              {"profile_id": "oneui5", "profile_name": "OneUI5", "variant": "oneui", "android": 13, "experimental": False},
              {"profile_id": "oneui6", "profile_name": "OneUI6", "variant": "oneui", "android": 14, "experimental": False},
              {"profile_id": "oneui7", "profile_name": "OneUI7", "variant": "oneui", "android": 15, "experimental": True},
              {"profile_id": "oneui8", "profile_name": "OneUI8", "variant": "oneui", "android": 16, "experimental": True},
              {"profile_id": "oneui85", "profile_name": "OneUI8.5", "variant": "oneui", "android": 16, "experimental": True},
              {"profile_id": "aosp", "profile_name": "AOSP", "variant": "aosp", "android": 14, "experimental": True},
          ]
          package_types = [
              {"package_id": "simple", "package_name": "Simple", "root_type": "Simple"},
              {"package_id": "magisk", "package_name": "Magisk", "root_type": "Magisk"},
              {"package_id": "kernelsu", "package_name": "KernelSU", "root_type": "KernelSU"},
          ]
          selected_profile = os.environ.get("PROFILE_INPUT") or "all"
          selected_package = os.environ.get("PACKAGE_TYPE_INPUT") or "all"
          entries = [
              {**profile, **package_type}
              for profile in profiles
              for package_type in package_types
              if selected_profile in ("all", profile["profile_id"])
              and selected_package in ("all", package_type["package_id"])
          ]
          if not entries:
              raise SystemExit("No package matrix entries matched the requested selection.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": entries}, separators=(",", ":")) + "\n")
          print(f"Selected {len(entries)} package build(s).")
          PY

  prepare_toolchain:
    name: Prepare pinned Google AOSP Clang 17.0.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-aosp-clang

  build:
    name: Build ${{ matrix.profile_name }} (${{ matrix.package_name }})
    needs:
      - select_matrix
      - prepare_toolchain
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select_matrix.outputs.matrix).include }}

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential bzip2 ccache flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi git lib32stdc++6 libc6-dev-i386 libelf-dev \
            libncurses-dev libssl-dev make python3 rsync unzip zip \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - uses: ./.github/actions/setup-aosp-clang

      - name: Build package
        env:
          ANDROID_VERSION: ${{ matrix.android }}
          PACKAGE_NAME: ${{ matrix.profile_name }}-${{ matrix.package_name }}
          PACKAGE_TYPE: ${{ matrix.package_id }}
          ROM_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          args=(--automated --device a50 --variant "$ROM_VARIANT"
            --android "$ANDROID_VERSION" --toolchain aosp_17
            --package-name "$PACKAGE_NAME")
          case "$PACKAGE_TYPE" in
            simple) ;;
            magisk) args+=(--magisk) ;;
            kernelsu) args+=(--ksu) ;;
            *) echo "::error::Unsupported package type: $PACKAGE_TYPE"; exit 1 ;;
          esac
          ./build.sh "${args[@]}"

      - name: Prepare and validate package
        env:
          ANDROID_VERSION: ${{ matrix.android }}
          EXPERIMENTAL: ${{ matrix.experimental }}
          PACKAGE_NAME: ${{ matrix.profile_name }}-${{ matrix.package_name }}
          PACKAGE_TYPE: ${{ matrix.package_id }}
          PROFILE_NAME: ${{ matrix.profile_name }}
          ROOT_TYPE: ${{ matrix.root_type }}
        run: |
          set -euo pipefail
          mkdir -p release
          package="${PACKAGE_NAME}.zip"
          test -s "$package"
          mv "$package" release/
          cp .config "release/kernel_config_${PACKAGE_NAME}.txt"
          {
            printf 'Package: %s\n' "$package"
            printf 'ROM profile: %s\n' "$PROFILE_NAME"
            printf 'Android platform: %s\n' "$ANDROID_VERSION"
            printf 'Root integration: %s\n' "$PACKAGE_TYPE"
            printf 'Experimental profile: %s\n' "$EXPERIMENTAL"
            printf 'Validation scope: build and archive structure only; no physical-device boot or ROM compatibility test\n'
          } > release/BUILD_INFO.txt
          bash ./.github/scripts/validate-kernel-artifacts.sh \
            "release/kernel_config_${PACKAGE_NAME}.txt" \
            "$PACKAGE_NAME.zip" \
            "$ROOT_TYPE"

      - name: Upload package and build evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.profile_name }}-${{ matrix.package_name }}
          path: release/
          if-no-files-found: error
