        gh release create "xbeta-${GITHUB_RUN_NUMBER}_a50dx" ./release/* \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "Galaxy A50 (beta-${GITHUB_RUN_NUMBER})" \
          --notes-file "./tools/make/release/a50-development.md"
