name: SOVR 4.2 — Galaxy A50 Android 14 One UI KSU

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/llvm-23.1.5-enforcement'
    paths:
      - 'build.sh'
      - '.github/workflows/sovr-a50-android14-ksu.yml'
      - 'arch/arm64/configs/exynos9610-a50_core_defconfig'
      - 'kernel/configs/**'
      - 'arch/arm64/boot/**'
      - 'tools/make/**'
      - 'Documentation/device-db/**'

permissions:
  contents: read

jobs:
  a50-android14-oneui-ksu:
    name: A50 / Android 14 / One UI / KSU / LLVM 23.1.5
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BUILD_JOBS: 2
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v4

      - name: Install kernel and packaging dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libelf-dev libssl-dev libncurses-dev lib32stdc++6 libc6-dev-i386 jq \
            xz-utils curl gnupg zip unzip python3 device-tree-compiler ccache rsync \
            lz4 zstd libxml2 libzstd1 zlib1g liblzma5 libicu70

      - name: Download and authenticate ClangBuiltLinux LLVM 23.1.5
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN_URL="https://www.kernel.org/pub/tools/llvm/files"
          KEY_FINGERPRINT="B8868C80BA62A1FFFAF5FDA9632D3A06589DA6B1"
          mkdir -p "$HOME/toolchains" "$RUNNER_TEMP/llvm-download"
          cd "$RUNNER_TEMP/llvm-download"

          curl --fail --location --retry 3 "$TOOLCHAIN_URL/sha256sums.asc" -o sha256sums.asc
          curl --fail --location --retry 3 "$TOOLCHAIN_URL/llvm-23.1.5-x86_64.tar.xz" -o llvm-23.1.5-x86_64.tar.xz

          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$KEY_FINGERPRINT"
          IMPORTED_FINGERPRINT="$(gpg --batch --with-colons --fingerprint "$KEY_FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$IMPORTED_FINGERPRINT" = "$KEY_FINGERPRINT"

          gpg --batch --status-fd=1 --verify sha256sums.asc > checksum-signature.status 2> checksum-signature.stderr
          grep -F "[GNUPG:] VALIDSIG $KEY_FINGERPRINT " checksum-signature.status

          EXPECTED_SHA256="b69433120ad62420d789f601c58a5472873c724be088c99a70b72fd30ca4af3c"
          ACTUAL_SHA256="$(awk '$2 == "llvm-23.1.5-x86_64.tar.xz" { print $1; found = 1 } END { exit !found }' sha256sums.asc)"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          printf '%s  %s\n' "$EXPECTED_SHA256" "llvm-23.1.5-x86_64.tar.xz" > llvm-23.1.5.sha256
          sha256sum --check llvm-23.1.5.sha256

          tar -xJf llvm-23.1.5-x86_64.tar.xz -C "$HOME/toolchains"
          CLANG_PATH="$(find "$HOME/toolchains" -path '*/bin/clang' -print -quit)"
          test -n "$CLANG_PATH"
          TOOLCHAIN_DIR="${CLANG_PATH%/bin/clang}"
          test -x "$TOOLCHAIN_DIR/bin/ld.lld"

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLCHAIN_DIR/lib:$TOOLCHAIN_DIR/lib64:${LD_LIBRARY_PATH:-}"
          clang --version | tee clang-version.txt
          ld.lld --version | tee lld-version.txt
          grep -Eq 'clang version 23\.1\.5([[:space:]]|$)' clang-version.txt
          grep -Eq 'LLD 23\.1\.5([[:space:]]|$)' lld-version.txt
          clang --print-targets | grep -qi 'aarch64'

          echo "SOVR_LLVM_TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$TOOLCHAIN_DIR/lib:$TOOLCHAIN_DIR/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          cp checksum-signature.status checksum-signature.stderr llvm-23.1.5.sha256 clang-version.txt lld-version.txt "$GITHUB_WORKSPACE/"

      - name: Validate build script syntax and pinned toolchain
        run: |
          set -euo pipefail
          bash -n build.sh
          test -x "$SOVR_LLVM_TOOLCHAIN_DIR/bin/clang"
          test -x "$SOVR_LLVM_TOOLCHAIN_DIR/bin/ld.lld"
          clang --version
          ld.lld --version

      - name: Build SOVR 4.2 A50 Android 14 One UI KSU
        run: |
          set -euo pipefail
          ./build.sh --ksu --automated --device a50 --variant oneui --android 14 --toolchain llvm_23.1.5

      - name: Validate and collect build artifacts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          VALIDATION_STATUS=0
          check() {
            local label="$1"
            shift
            if "$@"; then
              echo "PASS: $label" | tee -a artifacts/VALIDATION.txt
            else
              echo "FAIL: $label" | tee -a artifacts/VALIDATION.txt
              VALIDATION_STATUS=1
            fi
          }

          ZIP_PATH=""
          while IFS= read -r candidate; do ZIP_PATH="$candidate"; break; done < <(find . -maxdepth 1 -type f -name '*.zip' -print | sort)
          if [[ -s .config ]]; then
            cp .config artifacts/kernel_config_a50_android14_oneui_ksu
            grep -E '^(CONFIG_(KSU|KSU_SUSFS|KSU_MANUAL_HOOK|LTO_CLANG|THINLTO|CC_OPTIMIZE_FOR_PERFORMANCE_O3)=|# CONFIG_KSU_KPROBES_HOOK is not set)' .config > artifacts/config-feature-summary.txt || true
          fi
          [[ ! -s tools/make/boot.img ]] || cp tools/make/boot.img artifacts/boot.img
          if [[ -n "$ZIP_PATH" ]]; then
            cp "$ZIP_PATH" artifacts/kernel-package.zip
            unzip -p "$ZIP_PATH" Image > artifacts/Image || true
            unzip -p "$ZIP_PATH" dtb.img > artifacts/dtb.img || true
            unzip -Z1 "$ZIP_PATH" > artifacts/package-contents.txt || true
          fi

          check "kernel ZIP exists" test -n "$ZIP_PATH"
          check "mkbootimg output exists" test -s tools/make/boot.img
          check "resolved KSU config" grep -q '^CONFIG_KSU=y$' .config
          check "resolved SuSFS config" grep -q '^CONFIG_KSU_SUSFS=y$' .config
          check "resolved KSU manual hook" grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' .config
          check "KSU kprobes hook disabled" grep -q '^# CONFIG_KSU_KPROBES_HOOK is not set$' .config
          check "Clang LTO enabled" grep -q '^CONFIG_LTO_CLANG=y$' .config
          check "ThinLTO enabled" grep -q '^CONFIG_THINLTO=y$' .config
          check "O3 optimization enabled" grep -q '^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y$' .config
          check "packaged Image exists" test -s artifacts/Image
          check "packaged DTB exists" test -s artifacts/dtb.img
          check "installer script included" grep -Fxq 'mint.sh' artifacts/package-contents.txt
          check "installer binary included" grep -Fxq 'META-INF/com/google/android/update-binary' artifacts/package-contents.txt

          {
            echo "Baseline: SOVR 4.2 / Linux 4.14.357"
            echo "Device: Samsung Galaxy A50 SM-A505F / Exynos9610 / 4 GB RAM"
            echo "Android target: 14 / One UI / SELinux Enforcing"
            echo "Root: KernelSU + SuSFS"
            echo "Toolchain: Clang 23.1.5 / LLD 23.1.5 / ThinLTO"
            echo "Boot image OS version: 14.0.0"
            echo "Device DB patch level: source-defined value retained; not independently verified in this job"
            echo "Package source filename: ${ZIP_PATH:-missing}"
          } > artifacts/BUILD-MANIFEST.txt
          if compgen -G 'artifacts/*' > /dev/null; then sha256sum artifacts/* > artifacts/SHA256SUMS; fi
          exit "$VALIDATION_STATUS"

      - name: Upload A50 Android 14 KSU validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovr42-a50-android14-oneui-ksu-llvm2315
          if-no-files-found: warn
          path: |
            artifacts/**
            checksum-signature.status
            checksum-signature.stderr
            llvm-23.1.5.sha256
            clang-version.txt
            lld-version.txt