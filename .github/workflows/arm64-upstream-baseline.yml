name: ARM64 upstream v5.1 baseline

on:
  push:
    branches:
      - linux-5.1-exynos9610-integration
    paths:
      - 'Makefile'
      - 'arch/**'
      - 'block/**'
      - 'certs/**'
      - 'crypto/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
      - 'init/**'
      - 'kernel/**'
      - 'lib/**'
      - 'mm/**'
      - 'net/**'
      - 'scripts/**'
      - 'security/**'
      - 'sound/**'
      - 'tools/**'
      - 'virt/**'
      - '.github/workflows/arm64-upstream-baseline.yml'
      - 'docs/EXYNOS9610-VENDOR-PORTING-AUDIT.md'
      - 'EXYNOS9610_LINUX_51_INTEGRATION_PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4

      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential flex gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev device-tree-compiler python3

      - name: Configure ARM64 defconfig with Exynos9610 selector
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon defconfig
          scripts/config --enable SOC_EXYNOS9610
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -s kernelversion
          grep -q '^CONFIG_SOC_EXYNOS9610=y$' .config
          grep -q '^CONFIG_ARCH_EXYNOS=y$' .config
          grep -E '^(CONFIG_SOC_EXYNOS9610|CONFIG_ARCH_EXYNOS)=' .config

      - name: Build upstream ARM64 Image and DTBs
        run: |
          make -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon Image dtbs
          cp .config exynos9610-smoke.config

      - name: Compile Samsung A50 UNIVERSAL9610 DTBO from SOVR 4.2 sources
        run: |
          set -eux
          mkdir -p out/a50-dtbo
          cpp -nostdinc \
            -I include \
            -I arch/arm64/boot/dts \
            -I arch/arm64/boot/dts/exynos \
            -undef -D__DTS__ -x assembler-with-cpp \
            arch/arm64/boot/dts/exynos/exynos9610-universal9610.dts \
            > out/a50-dtbo/exynos9610-universal9610.pp.dts
          dtc -@ -I dts -O dtb \
            -o arch/arm64/boot/dts/exynos/exynos9610-universal9610.dtbo \
            out/a50-dtbo/exynos9610-universal9610.pp.dts \
            2> out/a50-dtbo/dtbo-compile-warnings.log
          strings arch/arm64/boot/dts/exynos/exynos9610-universal9610.dtbo | grep -q 'samsung,UNIVERSAL9610 A50'
          strings arch/arm64/boot/dts/exynos/exynos9610-universal9610.dtbo | grep -q '__fixups__'
          strings arch/arm64/boot/dts/exynos/exynos9610-universal9610.dtbo | grep -q '__symbols__'
          # Validate the overlay against the actual SoC DTB, not just its syntax.
          fdtoverlay \
            -i arch/arm64/boot/dts/exynos/exynos9610.dtb \
            -o out/a50-dtbo/exynos9610-universal9610-merged.dtb \
            arch/arm64/boot/dts/exynos/exynos9610-universal9610.dtbo
          dtc -I dtb -O dts \
            -o out/a50-dtbo/exynos9610-universal9610-merged.dts \
            out/a50-dtbo/exynos9610-universal9610-merged.dtb \
            2> out/a50-dtbo/merged-dtb-decompile-warnings.log
          echo "DTBO compile warning lines: $(grep -c 'Warning (' out/a50-dtbo/dtbo-compile-warnings.log || true)"
          echo "Merged-DTB audit warning lines: $(grep -c 'Warning (' out/a50-dtbo/merged-dtb-decompile-warnings.log || true)"
          cat out/a50-dtbo/dtbo-compile-warnings.log out/a50-dtbo/merged-dtb-decompile-warnings.log > out/a50-dtbo/all-dt-warning-output.log
          test -s out/a50-dtbo/exynos9610-universal9610-merged.dtb
          grep -q 'model =' out/a50-dtbo/exynos9610-universal9610-merged.dts

      - name: Inventory A50 Exynos9610 Linux 5.15 reference sources
        run: |
          set -euo pipefail
          git clone --depth=1 --branch exynos9610-port https://github.com/Vothcito/android_kernel_samsung_exynos9610_a50.git /tmp/vothcito-a50
          report=exynos9610-reference-source-inventory.txt
          : > "$report"
          echo "Reference: Vothcito/android_kernel_samsung_exynos9610_a50" | tee -a "$report"
          echo "Branch: exynos9610-port (Linux 5.15; source reference only, NOT Linux 5.1 compatible by assumption)" | tee -a "$report"
          while IFS= read -r path; do
            if test -f "/tmp/vothcito-a50/$path"; then
              printf 'PRESENT  %s\n' "$path" | tee -a "$report"
            else
              printf 'MISSING  %s\n' "$path" | tee -a "$report"
            fi
          done <<'A50_PATHS'
          drivers/soc/samsung/cal-if/cal-if.c
          drivers/soc/samsung/cal-if/cmucal.c
          drivers/soc/samsung/cal-if/exynos9610/cal_data.c
          drivers/soc/samsung/cal-if/exynos9610/cmucal-node.c
          drivers/soc/samsung/cal-if/exynos9610/pmucal_cpu_exynos9610.h
          drivers/soc/samsung/cal-if/pmucal_cpu.c
          drivers/scsi/ufs/ufs-exynos.c
          A50_PATHS
          git -C /tmp/vothcito-a50 rev-parse HEAD | sed 's/^/Reference commit: /' | tee -a "$report"
          echo "NOTE: inventory only; no vendor source copied or compiled in this step." | tee -a "$report"

      - name: Audit Exynos9610 vendor driver readiness
        run: |
          bash scripts/audit-exynos9610-vendor.sh exynos9610-vendor-audit.txt

      - name: Publish baseline build outputs
        uses: actions/upload-artifact@v4
        with:
          name: linux-v5.1-exynos9610-kconfig-smoke
          if-no-files-found: error
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/**/*.dtb
            arch/arm64/boot/dts/**/*.dtbo
            out/a50-dtbo/exynos9610-universal9610-merged.dtb
            out/a50-dtbo/*warnings.log
            exynos9610-smoke.config
            exynos9610-vendor-audit.txt
            exynos9610-reference-source-inventory.txt
            docs/EXYNOS9610-VENDOR-PORTING-AUDIT.md
