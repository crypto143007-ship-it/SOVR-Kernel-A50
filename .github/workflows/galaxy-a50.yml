  release:
    name: Release files and configs
    if: ${{ !contains(github.event.head_commit.message, '[skip rel]') }}
    needs: [oneui-s-m, oneui-s-n, oneui-r-m, oneui-r-n, aosp-s-m, aosp-s-n, aosp-r-m, aosp-r-n]
