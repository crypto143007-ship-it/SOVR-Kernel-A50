    - name: Merge Releases
      uses: actions/download-artifact@v8
      with:
        pattern: 'Release - *'
        path: release
        merge-multiple: true

    - name: Delete build config files
      run: |
          set -eo pipefail
          rm -rf ./release/kernel_config_*.txt

    - name: Publish release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh release create "mainline-${GITHUB_RUN_NUMBER}_a50dx" ./release/* \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "Mint Stable" \
          --notes-file "./tools/make/release/a50-release.md"
