name: Stable Release Build (Galaxy A50)

on:
  workflow_dispatch:
  push:
    branches:
      - 'android-*'

permissions:
  contents: read

jobs:
  prepare-toolchain:
    name: Prepare pinned Google AOSP Clang 17.0.2
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-aosp-clang

  oneui-s-m:
    name: Build One UI 4 (Magisk)
    needs: prepare-toolchain
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: true
      
    steps:
    - uses: actions/checkout@v7

    - name: Set timezone
      run: |
        sudo ln -snf /usr/share/zoneinfo/Asia/Manila /etc/localtime
        echo Asia/Manila | sudo tee /etc/timezone >/dev/null

    - name: Export build branch
      run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
      id: branch_name

    - name: Update Debian/Ubuntu Repositories
      run: sudo apt-get update

    - name: Install Debian/Ubuntu dependencies
      run: sudo apt-get install bzip2 lib32stdc++6 libc6-dev-i386 jq libncurses6 libncurses-dev unzip binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi -y

    - uses: ./.github/actions/setup-aosp-clang
    - name: Build Mint kernel
      run: |
          set -eo pipefail
          echo "  I: Building Mint kernel ${GITHUB_REF##*/}-${GITHUB_RUN_NUMBER}"
          ./build.sh --magisk --automated --device a50 --variant oneui --android 12 --toolchain aosp_17

    - name: Prepare release package
      run: |
          mkdir -p ./release
          mv -f `find ./ -maxdepth 2 -iname "SOVR-Kernel-*.zip" -o -iname "Mint-*.zip" -o -iname "*.zip"` ./release/ 2>/dev/null || true


    - name: Prepare build config artifact
      run: |
          cp .config ./release/kernel_config_a50_oneui-s-m.txt


    - name: Validate build artifacts and create checksums
      run: bash ./.github/scripts/validate-kernel-artifacts.sh release/kernel_config_a50_oneui-s-m.txt

    - name: Upload release package
      uses: actions/upload-artifact@v7
      with:
        name: One UI Four Kernel ZIPs
        path: 'release'
        if-no-files-found: error

    - name: Upload kernel image artifact
      uses: actions/upload-artifact@v7
      with:
        name: One UI 4 Kernel Image (Enforcing)
        path: 'release/boot-${{ github.job }}.img'
        if-no-files-found: error

    - name: Upload build config artifact
      uses: actions/upload-artifact@v7
      with:
        name: Kernel Config - ${{ github.job }}
        path: 'release/kernel_config_a50_oneui-s-m.txt'
        if-no-files-found: error

    - name: Upload release package
      uses: actions/upload-artifact@v7
      with:
        name: Release - ${{ github.job }}
        path: 'release'
        if-no-files-found: error

