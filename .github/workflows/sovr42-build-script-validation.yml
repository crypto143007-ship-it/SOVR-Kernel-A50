name: SOVR 4.2 Build Script Validation

on:
  push:
    branches:
      - work/sovr42-explicit-lld
    paths:
      - "build.sh"
      - "arch/arm64/configs/exynos9610-a50_core_defconfig"
      - "Makefile"
      - ".github/workflows/sovr42-build-script-validation.yml"
  pull_request:
    paths:
      - "build.sh"
      - "arch/arm64/configs/exynos9610-a50_core_defconfig"
      - "Makefile"
      - ".github/workflows/sovr42-build-script-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-script:
    name: Validate shell syntax and SOVR build guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: bash -n build.sh

      - name: Verify pinned toolchain is the default
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "BUILD_PREF_COMPILER_VERSION='clang_23_1_5'" build.sh
          grep -Fq 'BUILD_PREF_COMPILER_VERSION="${2:-clang_23_1_5}"' build.sh
          grep -Fq 'Using pinned ClangBuiltLinux 23.1.5' build.sh
          grep -Fq 'Automatic fallback to Neutron or another compiler is disabled.' build.sh

      - name: Verify exact compiler and linker contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "clang version 23\\.1\\.5" build.sh
          grep -Eq "LLD 23\\.1\\.5" build.sh
          test "$(grep -c 'LD=ld.lld LLVM=1' build.sh)" -ge 2

      - name: Verify pinned LLVM toolchain completeness
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'for REQUIRED_LLVM_TOOL in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do' build.sh
          grep -Fq 'CLANG_BIN="${TOOLCHAIN_EXT}/bin/clang"' build.sh
          grep -Fq 'LLD_BIN="${TOOLCHAIN_EXT}/bin/ld.lld"' build.sh
          grep -Fq 'Pinned LLVM toolchain is incomplete' build.sh
          grep -Fq 'Verified coherent LLVM 23.1.5 toolchain' build.sh

      - name: Verify pinned LLVM tools are passed to kernel make
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'HOSTCC="${CCACHE}clang" HOSTCXX="${CCACHE}clang++" LD=ld.lld LLVM=1 AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip' build.sh
          test "$(grep -c 'LD=ld.lld LLVM=1 AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip' build.sh)" -ge 2
          grep -Fq 'export PATH="${TOOLCHAIN_EXT}/bin:$PATH"' build.sh

      - name: Verify A50 core ThinLTO configuration and implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'CONFIG_LD_LLD=y' arch/arm64/configs/exynos9610-a50_core_defconfig
          grep -Fxq 'CONFIG_LTO_CLANG=y' arch/arm64/configs/exynos9610-a50_core_defconfig
          grep -Fxq 'CONFIG_THINLTO=y' arch/arm64/configs/exynos9610-a50_core_defconfig
          grep -Fq -- '-flto=thin' Makefile
          grep -Fq 'LD=ld.lld LLVM=1' build.sh
          echo "A50 core config enables Clang ThinLTO; Makefile contains ThinLTO implementation."

      - name: Verify pipefail-safe Magisk seed generation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq "tr -dc 'a-f0-9' < /dev/urandom | head -c 16" build.sh
          grep -Fq "od -An -N8 -tx1 /dev/urandom | tr -d ' \\n'" build.sh
          seed="$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          [[ "$seed" =~ ^[a-f0-9]{16}$ ]]

      - name: Verify stale Image protection
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'rm -f "$(pwd)/arch/arm64/boot/Image"' build.sh
          grep -Fq 'build_kernel || {' build.sh
