name: Setup pinned Google AOSP Clang
description: Restore or install the pinned Google AOSP Clang 17.0.2 toolchain

runs:
  using: composite
  steps:
    - name: Cache AOSP Clang 17.0.2
      id: clang-cache
      uses: actions/cache@v6
      with:
        path: ~/toolchains/clang-r487747c
        key: aosp-clang-17.0.2-${{ runner.os }}-${{ runner.arch }}-fd582b924a400906979f54121c05555b453d5c35

    - name: Install official AOSP Clang 17.0.2
      if: steps.clang-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail

        revision=fd582b924a400906979f54121c05555b453d5c35
        source_url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${revision}/clang-r487747c.tar.gz"
        toolchain_dir="$HOME/toolchains/clang-r487747c"
        work_dir="$(mktemp -d "${RUNNER_TEMP}/aosp-clang.XXXXXX")"
        trap 'rm -rf "$work_dir"' EXIT

        mkdir -p "$work_dir/extracted" "$HOME/toolchains"
        curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
          "$source_url" --output "$work_dir/clang-r487747c.tar.gz"
        tar -xzf "$work_dir/clang-r487747c.tar.gz" -C "$work_dir/extracted"

        if [[ "$(sed -n '1p' "$work_dir/extracted/AndroidVersion.txt")" != '17.0.2' ]] ||
          [[ "$(sed -n '2p' "$work_dir/extracted/AndroidVersion.txt")" != 'based on r487747c' ]]; then
          echo "::error::Downloaded Google Clang archive is not the pinned 17.0.2 r487747c toolchain."
          exit 1
        fi

        if [[ -e "$toolchain_dir" ]]; then
          echo "::error::Refusing to overwrite an existing toolchain directory: $toolchain_dir"
          exit 1
        fi
        mv "$work_dir/extracted" "$toolchain_dir"

    - name: Verify AOSP Clang toolchain
      shell: bash
      run: |
        set -euo pipefail

        toolchain_dir="$HOME/toolchains/clang-r487747c"
        tools=(clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-as llvm-ranlib)
        for tool in "${tools[@]}"; do
          if [[ ! -x "$toolchain_dir/bin/$tool" ]]; then
            echo "::error::Required AOSP Clang tool is missing or not executable: $toolchain_dir/bin/$tool"
            exit 1
          fi
        done

        if [[ "$(sed -n '1p' "$toolchain_dir/AndroidVersion.txt")" != '17.0.2' ]] ||
          [[ "$(sed -n '2p' "$toolchain_dir/AndroidVersion.txt")" != 'based on r487747c' ]]; then
          echo "::error::AOSP Clang version metadata does not match the pinned compiler revision."
          exit 1
        fi

        compiler_version="$("$toolchain_dir/bin/clang" --version)"
        if [[ "$compiler_version" != *"17.0.2"* ]] || [[ "$compiler_version" != *"r487747c"* ]]; then
          echo "::error::Unexpected compiler version: ${compiler_version%%$'\n'*}"
          exit 1
        fi
        printf '%s\n' "$compiler_version" | sed -n '1p'
        echo "$toolchain_dir/bin" >> "$GITHUB_PATH"
        echo "CLANG_DIR=$toolchain_dir" >> "$GITHUB_ENV"
